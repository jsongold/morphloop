# URL -> Path Item map for the artifact resource (ADR-0018). Owned by the
# artifact resource PR: this file is the only file that PR edits (plus an
# optional new components/artifact.yaml for artifact-specific schemas).
# Never edit ../root.yaml or another resource's paths/*.yaml — new URLs are
# just new top-level keys in this file, merged into the document by
# harness.testing.openapi_v2.load_merged_openapi_v2_spec (duplicate URLs
# across files are a load-time error). See ../README.md.
#
# Artifact: observations. Base type for anything operable/displayable; core defines only the base type, subclasses (LabArtifact, DiagramArtifact) live in the domain adapter layer.
#
# Lab artifacts (#62). Every POST takes an optional `Idempotency-Key` (UUID) header:
# it becomes the event id, and a resend returns the stored result.
/ws/{ws_id}/artifacts:
  parameters:
    - &ws_id {name: ws_id, in: path, required: true, schema: {type: string, pattern: '^ws_[0-9A-Za-z]{1,64}$'}}
  post:
    tags: [artifact]
    operationId: startArtifact
    parameters: [&key {name: Idempotency-Key, in: header, required: false, schema: {type: string, format: uuid}}]
    summary: Start an artifact from a pack artifact spec (records artifact.started).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [spec_id]
            properties:
              spec_id: {type: string, minLength: 1}
            additionalProperties: false
    responses:
      '201': &artifact
        description: The artifact's current state.
        content:
          application/json:
            schema:
              type: object
              required: [artifact_id, type, spec_id, user_id, session_id, ws_id, status, lab]
              properties:
                artifact_id: {type: string, pattern: '^art_[0-9A-Za-z]{1,64}$'}
                type: {type: string}
                spec_id: {type: string}
                user_id: {type: string}
                session_id: {type: [string, 'null']}
                ws_id: {type: string}
                status: {enum: [running, stopped]}
                lab:
                  description: The running lab of a `lab` artifact; `runtime_ref` is opaque.
                  type: [object, 'null']
                  required: [lab_instance_id, runtime_ref, image_digest, fixture_id]
                  properties:
                    lab_instance_id: {type: string}
                    runtime_ref: {type: string}
                    image_digest: {type: string}
                    fixture_id: {type: string}
                  additionalProperties: false
              additionalProperties: false
      default: &problem
        $ref: '../root.yaml#/components/responses/Problem'
/ws/{ws_id}/artifacts/{artifact_id}:
  parameters: &ids
    - *ws_id
    - {name: artifact_id, in: path, required: true, schema: {type: string, pattern: '^art_[0-9A-Za-z]{1,64}$'}}
  get:
    tags: [artifact]
    operationId: getArtifact
    summary: Read the artifact's current state.
    responses: {'200': *artifact, default: *problem}
/ws/{ws_id}/artifacts/{artifact_id}/reset:
  parameters: *ids
  post:
    tags: [artifact]
    operationId: resetArtifact
    parameters: [*key]
    summary: Replace the lab with a fresh one from the same spec (records artifact.reset).
    responses: {'200': *artifact, default: *problem}
/ws/{ws_id}/artifacts/{artifact_id}/stop:
  parameters: *ids
  post:
    tags: [artifact]
    operationId: stopArtifact
    parameters: [*key]
    summary: Stop the artifact and destroy its lab (records artifact.stopped).
    description: A lab is also stopped when its ws has had no learner activity for the configured idle limit.
    responses: {'200': *artifact, default: *problem}
/ws/{ws_id}/artifacts/{artifact_id}/check:
  parameters: *ids
  post:
    tags: [artifact]
    operationId: checkArtifact
    parameters: [*key]
    summary: Run one of the spec's allowed_checks against the lab (records artifact.checked).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [check_id]
            properties:
              check_id: {type: string, minLength: 1}
              params: {type: object}
            additionalProperties: false
    responses:
      '200':
        description: The observation, as recorded in artifact.checked.
        content:
          application/json:
            schema:
              type: object
              required: [artifact_id, check_id, passed, observed]
              properties:
                artifact_id: {type: string}
                check_id: {type: string}
                passed: {type: boolean}
                observed: {type: object}
              additionalProperties: false
      default: *problem
