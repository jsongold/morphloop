# Start the whole stack: docker compose up -d --build
# Host ports default to 8000 (api) and 3000 (web); override with API_PORT / WEB_PORT.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: morphloop
      POSTGRES_PASSWORD: morphloop
      POSTGRES_DB: morphloop
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morphloop -d morphloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    # Local secrets (e.g. OPENAI_API_KEY). Optional, so the stack still starts
    # without it; read on every `up`, so rebuilding one service keeps the key.
    env_file:
      - path: .env.local
        required: false
    environment:
      # DOCKER_HOST is passed through from the host only when it is set there
      # (the Docker endpoint is not the mounted socket below). LLM keys come
      # from env_file above: a bare name here would override it with nothing.
      - DATABASE_URL=postgresql+psycopg://morphloop:morphloop@db:5432/morphloop
      - WEB_ORIGIN=http://localhost:${WEB_PORT:-3000}
      - DOCKER_HOST
    # The lab runtime starts learner containers as siblings, so the api needs
    # the host's Docker endpoint. This grants the api container host-root
    # equivalent power; it is a local-development stack. Learner containers
    # never receive the socket (docs/ARCHITECTURE.md, security boundaries).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/swe/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db_data:
