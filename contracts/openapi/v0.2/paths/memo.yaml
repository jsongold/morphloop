# URL -> Path Item map for the memo resource (ADR-0018). Owned by the
# memo resource PR: this file is the only file that PR edits (plus an
# optional new components/memo.yaml for memo-specific schemas).
# Never edit ../root.yaml or another resource's paths/*.yaml — new URLs are
# just new top-level keys in this file, merged into the document by
# harness.testing.openapi_v2.load_merged_openapi_v2_spec (duplicate URLs
# across files are a load-time error). See ../README.md.
#
# Memo: entries, a child of ws. Append-only log; corrections are new entries, not edits. No automatic summarization (the learner writes, or chat is told to).
#
# `/memo/_stub` below is a placeholder with no meaning; replace or
# extend it with the resource's real paths.
/memo/_stub:
  get:
    tags: [memo]
    operationId: getMemoStub
    summary: Placeholder for the memo resource.
    description: |
      No behavior yet. Real endpoints for memo land in a follow-up PR
      that edits only this file (ADR-0018, issue #34).
    responses:
      '200':
        description: Stub response.
        content:
          application/json:
            schema:
              $ref: '../components/common.yaml#/Stub'
      default:
        $ref: '../root.yaml#/components/responses/Problem'
