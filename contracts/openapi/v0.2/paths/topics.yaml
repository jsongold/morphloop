/topics:
  get:
    tags: [session]
    operationId: listTopics
    summary: The loaded pack's learner-visible topic tree.
    responses:
      '200':
        description: Pack identity and topics in pack order.
        content:
          application/json:
            schema:
              type: object
              required: [pack_id, pack_hash, topics]
              additionalProperties: false
              properties:
                pack_id:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
                pack_hash:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                topics:
                  type: array
                  items:
                    $ref: '#/paths/~1topics/get/responses/200/content/application~1json/schema/$defs/topic'
              $defs:
                topic:
                  type: object
                  required: [id, title]
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'
                    title: {type: string, minLength: 1}
                    description: {type: string}
                    labels:
                      type: array
                      items: {type: string}
                    docs:
                      type: array
                      items: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,127}$'}
                    topics:
                      type: array
                      items:
                        $ref: '#/paths/~1topics/get/responses/200/content/application~1json/schema/$defs/topic'
      default:
        $ref: '../root.yaml#/components/responses/Problem'
