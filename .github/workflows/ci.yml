name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morphloop
          POSTGRES_PASSWORD: morphloop
          POSTGRES_DB: morphloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morphloop -d morphloop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://morphloop:morphloop@localhost:5432/morphloop
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy harness domains apps

      - name: Import linter
        run: uv run lint-imports

      - name: Pytest (SDK)
        run: uv run pytest -q -rs

      # Own step: the SDK tests stand in stubs for the app's artifact types, and one
      # process registers each type name once (apps/swe/pyproject.toml configures it).
      - name: Pytest (apps/swe)
        run: uv run pytest -q -rs apps/swe/tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/swe/web
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/swe/web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/swe/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
