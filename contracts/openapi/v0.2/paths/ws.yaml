# URL -> Path Item map for the ws resource (ADR-0018). Owned by the
# ws resource PR: this file is the only file that PR edits (plus an
# optional new components/ws.yaml for ws-specific schemas).
# Never edit ../root.yaml or another resource's paths/*.yaml — new URLs are
# just new top-level keys in this file, merged into the document by
# harness.testing.openapi_v2.load_merged_openapi_v2_spec (duplicate URLs
# across files are a load-time error). See ../README.md.
#
# Workspace (ws): threads, memo. The learner's work area; one learner can hold several. A thread is a topic-of-conversation unit with an optional target and is the LLM context split unit.
#
/ws:
  post:
    tags: [ws]
    operationId: createWs
    summary: Create a workspace (`ws.created`).
    description: |
      A learner may hold several ws at once. `labels` are ordinary
      classification labels (e.g. a topic label); the server always adds an
      `origin:learner` label of its own, since this endpoint is always
      called on the learner's behalf.
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: |
          Client-generated UUID, used as the event id. A resend with the same
          key and body returns the stored event; the same key with another
          body is 409. The server assigns a fresh UUID when absent.
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [session_id]
            properties:
              session_id:
                type: string
                pattern: '^ses_[0-9A-Za-z]{1,64}$'
              labels: &labels
                type: array
                uniqueItems: true
                items: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}(:[a-z0-9][a-z0-9._-]{0,127})?$'}
            additionalProperties: false
    responses:
      '201':
        description: |
          The stored `ws.created` event; its full shape is
          `contracts/schemas/events/envelope/v2/stored.json` with payload
          `contracts/schemas/events/payloads/ws.created/1.json`.
        content:
          application/json:
            schema: &ws_created_event
              type: object
              required: [id, position, type, created_at, actor, user_id, session_id, ws_id, payload]
              properties:
                id: {type: string}
                position: {type: integer, minimum: 1}
                type: {const: ws.created}
                created_at: {type: string, format: date-time}
                actor: {const: learner}
                user_id: {type: string}
                session_id: {type: string}
                ws_id: {type: string}
                payload: {type: object}
      default:
        $ref: '../root.yaml#/components/responses/Problem'
  get:
    tags: [ws]
    operationId: listWs
    summary: The learner's workspaces, most recently created first.
    parameters:
      - name: session_id
        in: query
        required: false
        description: Restrict to the ws's of one session; omit to list every ws of the learner.
        schema: {type: string, pattern: '^ses_[0-9A-Za-z]{1,64}$'}
      - $ref: '../root.yaml#/components/parameters/Cursor'
      - $ref: '../root.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Matching workspaces.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                next_cursor:
                  type: [string, 'null']
                  description: Opaque cursor for the next page; absent or null on the last page.
                items:
                  type: array
                  items: &ws_object
                    type: object
                    required:
                      [
                        ws_id,
                        user_id,
                        session_id,
                        labels,
                        created_at,
                        position,
                        main_thread_event_id,
                      ]
                    properties:
                      ws_id: {type: string}
                      user_id: {type: string}
                      session_id: {type: string}
                      labels: {type: array, items: {type: string}}
                      created_at: {type: string, format: date-time}
                      position:
                        type: integer
                        minimum: 1
                        description: The creating event's position; used to sort by creation order.
                      main_thread_event_id:
                        type: [string, "null"]
                        description: |
                          The id of the event that created this ws's main
                          (targetless) thread, or null before one exists.
                    additionalProperties: false
              additionalProperties: false
      default:
        $ref: '../root.yaml#/components/responses/Problem'

/ws/{ws_id}:
  get:
    tags: [ws]
    operationId: getWs
    summary: One workspace.
    parameters:
      - {name: ws_id, in: path, required: true, schema: {type: string}}
    responses:
      '200':
        description: The workspace.
        content:
          application/json:
            schema: *ws_object
      default:
        $ref: '../root.yaml#/components/responses/Problem'

/ws/{ws_id}/threads:
  post:
    tags: [ws]
    operationId: createThread
    summary: Create a thread in a ws (`thread.created`).
    description: |
      A thread is the topic-of-conversation unit inside a ws and the LLM
      context split unit (chat, issue #63). `target` says what it discusses;
      omit it for the ws's main thread (a `null` target is a client error).
      `target.kind` is one of `textbook_block`, `memo_entry`, `drill_item`,
      `artifact`; validating the id(s) it carries is that named resource's
      job, not this one's. `mode:hint` and similar are ordinary labels. The
      ws must exist (404). A ws has at most one main thread: a targetless
      request when one already exists returns that thread's stored event
      instead of creating another one.
    parameters:
      - {name: ws_id, in: path, required: true, schema: {type: string}}
      - name: Idempotency-Key
        in: header
        required: false
        description: |
          Client-generated UUID, used as the event id. A resend with the same
          key and body returns the stored event; the same key with another
          body is 409. The server assigns a fresh UUID when absent.
        schema: {type: string, format: uuid}
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              target:
                type: object
                required: [kind]
                properties:
                  kind:
                    enum: [textbook_block, memo_entry, drill_item, artifact]
              labels: *labels
            additionalProperties: false
    responses:
      '201':
        description: |
          The stored `thread.created` event; its full shape is
          `contracts/schemas/events/envelope/v2/stored.json` with payload
          `contracts/schemas/events/payloads/thread.created/1.json`.
        content:
          application/json:
            schema:
              type: object
              required: [id, position, type, created_at, actor, user_id, session_id, ws_id, payload]
              properties:
                id: {type: string}
                position: {type: integer, minimum: 1}
                type: {const: thread.created}
                created_at: {type: string, format: date-time}
                actor: {const: learner}
                user_id: {type: string}
                session_id: {type: string}
                ws_id: {type: string}
                payload: {type: object}
      default:
        $ref: '../root.yaml#/components/responses/Problem'
  get:
    tags: [ws]
    operationId: listThreads
    summary: The caller's threads in this ws, in creation order.
    description: |
      `target` and `labels` are the same shape the thread was created with
      (`target.kind` plus that named resource's own extra fields, e.g. a
      highlight's popup thread carries `target.highlight_id`). Messages
      inside a thread are `GET /ws/{ws_id}/threads/{thread_id}/messages`
      (issue #63), not returned here. The ws must exist and belong to the
      caller (404 otherwise).
    parameters:
      - {name: ws_id, in: path, required: true, schema: {type: string}}
      - name: target_highlight_id
        in: query
        required: false
        description: Only threads whose `target` carries this `highlight_id` (issue #129).
        schema: {type: string, pattern: '^hl_[0-9A-Za-z]{1,64}$'}
      - $ref: '../root.yaml#/components/parameters/Cursor'
      - $ref: '../root.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Matching threads, oldest first.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                next_cursor:
                  type: [string, 'null']
                  description: Opaque cursor for the next page; absent or null on the last page.
                items:
                  type: array
                  items:
                    type: object
                    required: [thread_id, target, labels, created_at]
                    additionalProperties: false
                    properties:
                      thread_id: {type: string}
                      target: {type: [object, "null"]}
                      labels: {type: array, items: {type: string}}
                      created_at: {type: string, format: date-time}
      default:
        $ref: '../root.yaml#/components/responses/Problem'
