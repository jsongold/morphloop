# URL -> Path Item map for the artifact resource (ADR-0018). Owned by the
# artifact resource PR: this file is the only file that PR edits (plus an
# optional new components/artifact.yaml for artifact-specific schemas).
# Never edit ../root.yaml or another resource's paths/*.yaml — new URLs are
# just new top-level keys in this file, merged into the document by
# harness.testing.openapi_v2.load_merged_openapi_v2_spec (duplicate URLs
# across files are a load-time error). See ../README.md.
#
# Artifact: the type-neutral base only. The SDK defines the base type; the
# concrete types (lab, diagram, ...) and their state belong to the app built
# on the SDK (ADR-0018 s19), so this document fixes the identity and status
# fields and leaves type-specific state open (`additionalProperties: true`).
# The SWE app's lab shape (`lab` object, `/check`) is apps/swe/swe/openapi/
# artifact-lab.yaml; an app-specific operation is not declared here.
#
# Every POST takes an optional `Idempotency-Key` (UUID) header: it becomes
# the event id, and a resend by the same learner in the same ws returns the
# stored result (another learner's key: 409 idempotency-key-reused).
/artifact-specs/{spec_id}:
  get:
    tags: [artifact]
    operationId: getArtifactSpec
    summary: Read a learner-safe artifact spec from the loaded pack.
    parameters:
      - name: spec_id
        in: path
        required: true
        schema: {type: string, minLength: 1}
    responses:
      '200':
        description: The type-selected learner view of the artifact spec.
        content:
          application/json:
            schema:
              type: object
              required: [id, type, labels, spec]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                type: {type: string, minLength: 1}
                labels: {type: array, items: {type: string}}
                spec: {type: object, additionalProperties: true}
      default:
        $ref: '../root.yaml#/components/responses/Problem'
/ws/{ws_id}/artifacts:
  parameters:
    - &ws_id {name: ws_id, in: path, required: true, schema: {type: string, pattern: '^ws_[0-9A-Za-z]{1,64}$'}}
  get:
    tags: [artifact]
    operationId: listArtifacts
    summary: The learner's artifacts in this ws, in creation order (oldest first).
    parameters:
      - {name: spec_id, in: query, required: false, schema: {type: string, minLength: 1}}
    responses:
      '200':
        description: Matching artifacts. An unknown or another learner's ws is 404.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [artifact_id, type, spec_id, status]
                    properties:
                      artifact_id: {type: string, pattern: '^art_[0-9A-Za-z]{1,64}$'}
                      type: {type: string}
                      spec_id: {type: string}
                      status: {enum: [running, stopped]}
                    additionalProperties: false
              additionalProperties: false
      default:
        $ref: '../root.yaml#/components/responses/Problem'
  post:
    tags: [artifact]
    operationId: startArtifact
    parameters: [&key {name: Idempotency-Key, in: header, required: false, schema: {type: string, format: uuid}}]
    summary: Start an artifact from a pack artifact spec (records artifact.started).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [spec_id]
            properties:
              spec_id: {type: string, minLength: 1}
            additionalProperties: false
    responses:
      '201': &artifact
        description: The artifact's current state; type-specific state is app-owned.
        content:
          application/json:
            schema:
              type: object
              required: [artifact_id, type, spec_id, user_id, session_id, ws_id, status]
              properties:
                artifact_id: {type: string, pattern: '^art_[0-9A-Za-z]{1,64}$'}
                type: {type: string}
                spec_id: {type: string}
                user_id: {type: string}
                session_id: {type: [string, 'null']}
                ws_id: {type: string}
                status: {enum: [running, stopped]}
              additionalProperties: true
      default: &problem
        $ref: '../root.yaml#/components/responses/Problem'
/ws/{ws_id}/artifacts/{artifact_id}:
  parameters: &ids
    - *ws_id
    - {name: artifact_id, in: path, required: true, schema: {type: string, pattern: '^art_[0-9A-Za-z]{1,64}$'}}
  get:
    tags: [artifact]
    operationId: getArtifact
    summary: Read the artifact's current state.
    responses: {'200': *artifact, default: *problem}
/ws/{ws_id}/artifacts/{artifact_id}/reset:
  parameters: *ids
  post:
    tags: [artifact]
    operationId: resetArtifact
    parameters: [*key]
    summary: Replace the artifact's runtime state with a fresh one from the same spec (records artifact.reset).
    responses: {'200': *artifact, default: *problem}
/ws/{ws_id}/artifacts/{artifact_id}/stop:
  parameters: *ids
  post:
    tags: [artifact]
    operationId: stopArtifact
    parameters: [*key]
    summary: Stop the artifact and release its runtime state (records artifact.stopped).
    responses: {'200': *artifact, default: *problem}
