# The SWE app stack: db / api / web. Run it from apps/swe with ./scripts/dev.sh up
# (per-worktree project name and ports); plain `docker compose up -d --build` also
# works and uses host ports 8000 (api) and 3000 (web), overridable with API_PORT /
# WEB_PORT.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: morphloop
      POSTGRES_PASSWORD: morphloop
      POSTGRES_DB: morphloop
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morphloop -d morphloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # The SDK repo root while this app is a uv workspace member (see Dockerfile).
      context: ../..
      dockerfile: apps/swe/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    # LLM keys (e.g. OPENAI_API_KEY). Optional, so the stack starts without it;
    # read on every `up`, so rebuilding one service keeps the key.
    env_file:
      - path: .env.local
        required: false
    environment:
      # DOCKER_HOST and MORPHLOOP_LLM_PROVIDER pass through from the host only when
      # set there (MORPHLOOP_LLM_PROVIDER=fake is dev.sh's --fake-llm). LLM keys come
      # from env_file above: a bare name here would override it with nothing.
      - DATABASE_URL=postgresql+psycopg://morphloop:morphloop@db:5432/morphloop
      - WEB_ORIGIN=http://localhost:${WEB_PORT:-3000}
      - DOCKER_HOST
      - MORPHLOOP_LLM_PROVIDER
    # The lab runtime starts learner containers as siblings, so the api needs the
    # host's Docker endpoint. This grants the api container host-root equivalent
    # power; it is a local stack. Learner containers never receive the socket.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db_data:
