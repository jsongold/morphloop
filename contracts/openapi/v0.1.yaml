openapi: 3.1.0
info:
  title: morphloop harness HTTP API
  version: 0.1.0
  summary: HTTP contract for the v0.1 learner chain (DNS vertical slice, ADR-0012), domain-agnostic.
  description: |
    Boundary contract between the harness API (`harness/api/`) and any UI (the
    standard web UI or a custom one, ADR-0015). No code is generated from this
    document (ADR-0017); both sides are hand-written and checked by contract
    tests.

    Schemas that already exist under `contracts/schemas/` are referenced by
    their absolute `$id` (events, ws, llm, common). Schemas that only exist on
    the HTTP boundary live in `components.schemas`. See
    `contracts/openapi/README.md` for the decisions behind this document.

    Conventions:
    - Every request that appends events carries a client-chosen
      `idempotency_key` in the body. It becomes the `idempotency_key` of the
      primary event the request appends. Resending the same key with the same
      body appends nothing and returns the original status and body, with
      `Idempotent-Replayed: true` (ADR-0008, AC-F5). The same key with a
      different body is rejected with `409 idempotency-key-reused`.
    - Every error body is `application/problem+json` (`Problem`, RFC 9457).
    - Events are ordered by the DB-assigned `position` only (ADR-0008).
    - The reference solution, environment params, templates, generation
      records and evaluator rubrics are never served (AC-J6). Pack data is
      served only through the learner-facing views below.
    - v0.1 has no authentication (single local learner). `security` is empty.

    The terminal WebSocket cannot be modeled in OpenAPI; it is documented under
    the root `x-websockets` extension and its messages are defined in
    `contracts/schemas/ws/`.
servers:
  - url: http://localhost:8000
    description: Local Docker Compose stack
security: []
tags:
  - name: system
  - name: packs
  - name: learners
  - name: sessions
  - name: content
  - name: attempts
  - name: labs
  - name: events
  - name: chat
  - name: memos

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and DB connectivity (Slice 0, unchanged).
      responses:
        '200':
          description: The API process is up. `db` reports DB connectivity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /packs:
    get:
      tags: [packs]
      operationId: listPacks
      summary: List imported pack versions a session can be started on.
      description: |
        Packs are imported by the CLI Importer from a local path (ADR-0015);
        there is no HTTP import. Every imported (pack_id, pack_content_hash)
        pair is kept, so one pack_id may appear more than once.
      responses:
        '200':
          description: Imported packs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackList'

  /learners:
    post:
      tags: [learners]
      operationId: createLearner
      summary: Create a learner identity.
      description: |
        A learner is an identity only; learner state lives in events and
        projections. This request appends no event and is not idempotent: a
        retried request may create an unused learner, which is harmless.
      responses:
        '201':
          description: Learner created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Learner'
        default:
          $ref: '#/components/responses/Problem'

  /learners/{learner_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/LearnerId'
    get:
      tags: [learners, sessions]
      operationId: listLearnerSessions
      summary: List a learner's sessions, most recently started first.
      description: Lets a client that lost its session id find the session to resume (AC-F4).
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        default:
          $ref: '#/components/responses/Problem'

  /learners/{learner_id}/skills:
    parameters:
      - $ref: '#/components/parameters/LearnerId'
    get:
      tags: [learners]
      operationId: getLearnerSkills
      summary: Read the learner-skill projection.
      description: |
        Current per-skill state, derived from `learner_skill.updated` events
        (ADR-0008, ADR-0013). A skill with no update yet is absent. Use the
        timeline or the attempt result for the evidence behind each update.
      parameters:
        - name: pack_id
          in: query
          required: false
          description: Only skills of this pack.
          schema:
            $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/pack_id
      responses:
        '200':
          description: Skill states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillStateList'
        default:
          $ref: '#/components/responses/Problem'

  /sessions:
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start a session for a learner on one imported pack version.
      description: |
        Appends `session.started` with session-constant provenance (ADR-0010).
        The session is pinned to the given pack content hash for its lifetime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionStartRequest'
      responses:
        '201':
          description: Session started (or idempotent replay of the original response).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [sessions]
      operationId: getSession
      summary: Resume state of a session after reload or restart (AC-F4).
      description: |
        Everything needed to rebuild the screen except the potentially long
        lists, which have their own endpoints: chat, highlights and timeline.
        All of it is read from projections rebuildable from events (AC-F6).
      responses:
        '200':
          description: Session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionState'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/layout:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [content]
      operationId: getSessionLayout
      summary: The pack's layout document for the session's pack version.
      description: |
        Served as an opaque object. v0.1 fixes no generic layout schema
        (ADR-0003, ADR-0012); the standard UI interprets it and must tolerate
        unknown keys, a custom UI may ignore it (ADR-0015).
      responses:
        '200':
          description: Layout document, or null when the pack declares none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/activities:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [content, attempts]
      operationId: listSessionActivities
      summary: Learner-facing views of the activities a learner may start in this session.
      description: |
        v0.1 has no policy (ADR-0012): the learner chooses from this list.
        Holdout activities are never listed. Each item is a whitelist view of
        the ActivityDefinition; the reference solution, environment,
        checks and evaluator are never included (AC-J6).
      responses:
        '200':
          description: Activities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/content:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [content]
      operationId: listSessionContent
      summary: List learner-facing content documents of the session's pack version.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContentKind'
      responses:
        '200':
          description: Content summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentList'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/content/{kind}/{definition_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ContentKind'
      - name: definition_id
        in: path
        required: true
        schema:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/definition_id
    get:
      tags: [content]
      operationId: getSessionContent
      summary: One learner-facing content document (skill, visualization, reference).
      description: |
        Deterministic retrieval: the same session always gets the same
        document for the same id (AC-J3). Used for the visualization and its
        reality mapping (AC-C1, AC-C2) and for side-pane explanations (AC-D1).
      responses:
        '200':
          description: Content document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDocument'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [attempts]
      operationId: startAttempt
      summary: Start an ActivityAttempt from an ActivityDefinition.
      description: |
        Appends `activity.started` (with the Definition hash, AC-J3). For a
        lab-backed activity the server also starts a LabInstance and appends
        `lab.started` when it is up; the client does not start labs. The
        response returns immediately with the lab in `starting`; the client
        opens the terminal WebSocket and waits for `lab.status` `ready`.
        A session has at most one attempt that is not `completed`; starting
        another fails with `409 state-conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptStartRequest'
      responses:
        '201':
          description: Attempt started (or idempotent replay of the original response).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptState'
        default:
          $ref: '#/components/responses/Problem'

  /attempts/{attempt_id}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [attempts]
      operationId: getAttempt
      summary: Attempt status, current lab and, once completed, the evaluation result.
      description: Poll this after `submit`, or refetch when `event.appended` announces `activity.completed`.
      responses:
        '200':
          description: Attempt state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptState'
        default:
          $ref: '#/components/responses/Problem'

  /attempts/{attempt_id}/submit:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [attempts]
      operationId: submitAttempt
      summary: Submit the attempt for evaluation.
      description: |
        Appends `activity.submitted` for the current lab instance and returns
        `202` with the attempt in `evaluating`. Evaluation runs server-side:
        deterministic checks, then the LLM evaluator, then the learner model
        (`evaluation.completed` → `evidence.created` → `learner_skill.updated`
        → `activity.completed`). The client polls `GET /attempts/{attempt_id}`
        or reacts to `event.appended`. If an LLM output fails schema
        validation, no learner state changes (AC-E4); the attempt returns to
        `active` with `last_submission_error` set and may be submitted again
        with a new key. Only an `active` attempt can be submitted
        (`409 state-conflict` otherwise). A replay returns the original `202`
        body, not the current state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Submission accepted (or idempotent replay of the original response).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptState'
        default:
          $ref: '#/components/responses/Problem'

  /labs/{lab_instance_id}:
    parameters:
      - $ref: '#/components/parameters/LabInstanceId'
    get:
      tags: [labs]
      operationId: getLab
      summary: State of one LabInstance.
      description: |
        The terminal for this instance is the WebSocket
        `/labs/{lab_instance_id}/terminal` (see `x-websockets`).
      responses:
        '200':
          description: Lab state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabState'
        default:
          $ref: '#/components/responses/Problem'

  /labs/{lab_instance_id}/reset:
    parameters:
      - $ref: '#/components/parameters/LabInstanceId'
    post:
      tags: [labs]
      operationId: resetLab
      summary: Reset the lab to its known fixture (AC-B4).
      description: |
        Appends `lab.reset` for this instance, destroys it and starts a new
        LabInstance for the same attempt (ADR-0007), which appends
        `lab.started` with `trigger: reset`. Returns `202` with the new
        instance in `starting`. The old terminal WebSocket is closed; the
        client connects to the new instance's terminal. Resetting an instance
        that is already replaced or whose attempt is not `active` fails with
        `409 state-conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: Reset accepted; body is the replacement lab (or idempotent replay).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabState'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [events]
      operationId: appendClientEvent
      summary: Append one client-originated learner event (highlight, content opened, visualization step, memo edit).
      description: |
        For learner UI actions that are pure facts with no server-side
        effect beyond projections: `content.highlighted` (AC-D1, AC-D2),
        `content.opened` (side pane) and `visualization.step_selected`
        (AC-C2), and `memo.edited` (the learner rewrites a memo; the memo
        must exist, else `404 not-found`). New highlights use
        `content.highlighted` v2, whose `source` addresses pack content, a
        chat message or terminal output. The body is validated through the events dispatch, so the
        payload is exactly the event payload schema. The server adds
        `event_id`, `learner_id`, `session_id`, `actor: learner`,
        `activity_definition_id` (from `attempt_id`), `causation_id` and
        `correlation_id`, then validates the result as an append request.
        Ids inside the payload (`highlight_id`) are generated by the client
        (opaque, prefix `hl_`). Commands with side effects (start, submit,
        reset, chat) have their own endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientEventRequest'
      responses:
        '201':
          description: Event appended (or idempotent replay returning the existing event).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAppendResponse'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/chat/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [chat]
      operationId: sendChatMessage
      summary: Send a learner chat message and receive the tutor reply synchronously.
      description: |
        Appends `assistant.message_requested`, builds the tutor context
        (referenced highlights, current activity, recent terminal actions;
        AC-D5, AC-E1, AC-E2), calls the tutor and appends
        `assistant.message_generated`. The response carries both stored
        events. The learner may ask for a reply mode with `requested_mode`
        (values declared by the pack); when it is omitted or null the harness
        chooses. The harness decides the final mode and may override the
        request (e.g. hint during an unfinished attempt, AC-E3), and never puts
        the reference solution in the tutor context during an unfinished
        attempt (AC-J6).
        If the tutor call fails or its output is invalid, the request event
        stays recorded and the response is `502`; resending the same
        `idempotency_key` appends no second request event and retries the
        reply.

        Highlight threads (popup chat): a highlight `hl_<tail>` owns the
        thread `thr_<tail>`. The client sends that `thread_id` even for the
        first message (no server round trip to create the thread). When
        `thread_id` is a highlight thread of this session, the server always
        puts that highlight in the tutor context, whether or not
        `references` lists it. After the reply is appended, if the pack
        declares `registry.memo_summarizer` and the memo `memo_<tail>` has
        not been edited by the learner, the server calls the summarizer and
        appends `memo.recorded` (causation: the reply event), and returns
        the memo as `memo`. A summarizer failure never fails the request:
        the reply is returned with `memo: null` and the next reply retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '201':
          description: Request and reply recorded (or idempotent replay of both).
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatExchange'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/chat:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [chat]
      operationId: getSessionChat
      summary: All chat messages of the session in position order (AC-F4).
      description: |
        `assistant.message_requested` and `assistant.message_generated`
        stored events. v0.1 has no edit or delete events, so the chat
        projection is exactly these events. The popup chat loads one thread
        with `thread_id` (an unknown or empty thread returns no events).
      parameters:
        - name: thread_id
          in: query
          required: false
          description: Only events of this thread. Omitted means every thread.
          schema:
            $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/thread_id
      responses:
        '200':
          description: Chat events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatEventList'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/highlights:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [events]
      operationId: getSessionHighlights
      summary: All highlights of the session in position order (AC-D2).
      description: |
        `content.highlighted` stored events (v1 and v2; v1 reads as
        source `pack`). v0.1 has no edit or delete events, so the highlight
        projection is exactly these events.
      responses:
        '200':
          description: Highlight events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HighlightEventList'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/memos:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [memos]
      operationId: getSessionMemos
      summary: Learning memos of the session, one per highlight thread, current text.
      description: |
        Projection of `memo.recorded` and `memo.edited`: the latest of the
        two per `memo_id` gives `title` and `body`. Ordered by the position
        of each memo's first `memo.recorded`. Edits go through
        `POST /sessions/{session_id}/events` with `memo.edited`.
      responses:
        '200':
          description: Memos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoList'
        default:
          $ref: '#/components/responses/Problem'

  /sessions/{session_id}/timeline:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [events]
      operationId: getSessionTimeline
      summary: Stored events of the session ordered by position (AC-F2, AC-F7, AC-B3).
      description: |
        Keyset pagination on `position`: pass the previous page's
        `last_position` as `after_position`. Includes every event type,
        including `terminal.output` chunks. Guarantee: an event with a
        position at or below a returned `last_position` never appears later,
        so a client that pages forward never misses an event (the server
        serializes appends per session or holds back uncommitted gaps).
      parameters:
        - name: after_position
          in: query
          required: false
          description: Return events with position strictly greater than this. Omitted means from the start.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Maximum events per page. Omitted means 100.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        default:
          $ref: '#/components/responses/Problem'

x-websockets:
  /labs/{lab_instance_id}/terminal:
    summary: Terminal and push channel of one LabInstance (AC-B1, AC-C3).
    description: |
      WebSocket, one connection per LabInstance. Every frame is a JSON text
      frame validated by `message` (contracts/schemas/ws/envelope/message.json,
      dispatched by contracts/schemas/ws/dispatch.json). The server sends
      `lab.status` first; `terminal_id` arrives with `status: ready`. The
      terminal bridge, not the client, appends `terminal.command` and
      `terminal.output` events (AC-B2). `event.appended` notifies of other
      events in the session (thin; fetch the full event from the timeline).
      After a reset the server closes the connection and the client connects
      to the replacement instance returned by `POST /labs/{lab_instance_id}/reset`.
      An unknown lab instance is refused at the handshake with HTTP 404.
      See contracts/schemas/ws/README.md.
    parameters:
      - $ref: '#/components/parameters/LabInstanceId'
    message:
      $ref: https://morphloop.dev/contracts/schemas/ws/envelope/message.json
    dispatch:
      $ref: https://morphloop.dev/contracts/schemas/ws/dispatch.json
    clientToServer: [terminal.input, terminal.resize, ping]
    serverToClient: [terminal.output, terminal.exit, lab.status, event.appended, error, pong]

components:
  parameters:
    LearnerId:
      name: learner_id
      in: path
      required: true
      schema:
        $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/learner_id
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/session_id
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema:
        $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/attempt_id
    LabInstanceId:
      name: lab_instance_id
      in: path
      required: true
      schema:
        $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/lab_instance_id

  headers:
    IdempotentReplayed:
      description: '`true` when the response replays an earlier request with the same idempotency_key; absent otherwise.'
      schema:
        const: 'true'

  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---------- errors ----------
    Problem:
      title: Problem details
      description: |
        RFC 9457 problem details with a closed `code` vocabulary. `code` → status:
        `invalid-request` 400 (malformed JSON or parameters);
        `not-found` 404;
        `idempotency-key-reused` 409 (same key, different body);
        `state-conflict` 409 (operation not allowed in the current state, e.g.
        a second open attempt, submit of a non-active attempt, reset of a
        replaced lab, a highlight_id already in use);
        `validation-failed` 422 (body fails its schema; `errors` lists paths);
        `llm-failed` 502 (an LLM call failed or its output failed validation;
        no learner state changed);
        `lab-unavailable` 503 (the lab runtime could not start or reset a lab);
        `internal` 500.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          description: URI reference identifying the problem type, `about:blank` or `https://morphloop.dev/problems/<code>`.
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          enum:
            - invalid-request
            - not-found
            - idempotency-key-reused
            - state-conflict
            - validation-failed
            - llm-failed
            - lab-unavailable
            - internal
        errors:
          description: Validation errors, for `validation-failed`.
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                description: JSON path into the request, e.g. `$.payload.end_offset`.
                type: string
              message:
                type: string
            additionalProperties: false
      additionalProperties: false

    # ---------- common request pieces ----------
    CommandRequest:
      title: Command request
      description: Body of a command that appends events and has no other input.
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/idempotency_key
      additionalProperties: false

    # ---------- system ----------
    Health:
      type: object
      required: [status, db]
      properties:
        status:
          const: ok
        db:
          enum: [ok, down]
      additionalProperties: false

    # ---------- packs / learners ----------
    Pack:
      title: Imported pack version
      type: object
      required: [pack, title, imported_at, latest]
      properties:
        pack:
          $ref: https://morphloop.dev/contracts/schemas/common/provenance.json#/$defs/pack
        title:
          type: string
          minLength: 1
        latest:
          type: boolean
          description: >-
            True for the most recent import of this pack_id (import order, not wall-clock).
            New sessions start only on the latest import; older ones stay reachable
            through existing sessions.
        imported_at:
          $ref: https://morphloop.dev/contracts/schemas/common/timestamp.json
      additionalProperties: false
    PackList:
      type: object
      required: [packs]
      properties:
        packs:
          type: array
          items:
            $ref: '#/components/schemas/Pack'
      additionalProperties: false
    Learner:
      type: object
      required: [learner_id, created_at]
      properties:
        learner_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/learner_id
        created_at:
          $ref: https://morphloop.dev/contracts/schemas/common/timestamp.json
      additionalProperties: false
    SkillStateView:
      title: Learner skill state (projection)
      type: object
      required: [pack_id, skill_id, state, update_count, last_update_event_id, updated_at]
      properties:
        pack_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/pack_id
        skill_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/skill_id
        state:
          $ref: https://morphloop.dev/contracts/schemas/common/skill-state.json
        update_count:
          description: Number of `learner_skill.updated` events applied.
          type: integer
          minimum: 1
        last_update_event_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/event_id
        updated_at:
          $ref: https://morphloop.dev/contracts/schemas/common/timestamp.json
      additionalProperties: false
    SkillStateList:
      type: object
      required: [learner_id, skills]
      properties:
        learner_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/learner_id
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillStateView'
      additionalProperties: false

    # ---------- sessions ----------
    SessionStartRequest:
      type: object
      required: [idempotency_key, learner_id, pack_id, pack_content_hash]
      properties:
        idempotency_key:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/idempotency_key
        learner_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/learner_id
        pack_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/pack_id
        pack_content_hash:
          description: Selects the exact imported pack version (ADR-0010); from `GET /packs`.
          $ref: https://morphloop.dev/contracts/schemas/common/content-hash.json
      additionalProperties: false
    Session:
      type: object
      required: [session_id, learner_id, pack, started_at, session_started_event_id]
      properties:
        session_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/session_id
        learner_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/learner_id
        pack:
          $ref: https://morphloop.dev/contracts/schemas/common/provenance.json#/$defs/pack
        started_at:
          $ref: https://morphloop.dev/contracts/schemas/common/timestamp.json
        session_started_event_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/event_id
      additionalProperties: false
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
      additionalProperties: false
    UiState:
      title: Restorable UI state (projection)
      description: |
        Derived from `content.opened` and `visualization.step_selected`
        (docs/UX.md Persistence). Items reuse the event payload schemas.
      type: object
      required: [open_content, visualization_steps]
      properties:
        open_content:
          description: Payload of the latest `content.opened`, or null.
          anyOf:
            - $ref: https://morphloop.dev/contracts/schemas/events/payloads/content.opened/1.json
            - type: 'null'
        visualization_steps:
          description: Payload of the latest `visualization.step_selected` per visualization.
          type: array
          items:
            $ref: https://morphloop.dev/contracts/schemas/events/payloads/visualization.step_selected/1.json
      additionalProperties: false
    SessionState:
      title: Session resume state
      type: object
      required: [session, last_position, active_attempt, ui_state]
      properties:
        session:
          $ref: '#/components/schemas/Session'
        last_position:
          description: Position of the session's latest event; a timeline cursor to continue from.
          type: integer
          minimum: 1
        active_attempt:
          description: The attempt that is not yet `completed`, or null.
          anyOf:
            - $ref: '#/components/schemas/AttemptState'
            - type: 'null'
        ui_state:
          $ref: '#/components/schemas/UiState'
      additionalProperties: false

    # ---------- content (learner-facing pack views) ----------
    LayoutResponse:
      type: object
      required: [layout]
      properties:
        layout:
          description: The pack's layout document as parsed, or null. Opaque in v0.1 (ADR-0012).
          anyOf:
            - type: object
            - type: 'null'
      additionalProperties: false
    ActivityView:
      title: Learner-facing activity view
      description: |
        Whitelist view of an ActivityDefinition (AC-J6). Only these fields
        reach the learner. Deliberately absent: reference solution,
        environment and its params, checks, evaluator, origin, tools and, in
        v0.1, hints (v0.1 has no hint-request event, so hints reach the
        learner through the tutor in hint mode). Minimal on purpose so it does
        not depend on the pack schemas that are still being written.
      type: object
      required:
        - activity_definition_id
        - activity_definition_hash
        - title
        - activity_type
        - skill_ids
        - lab_backed
        - instructions
      properties:
        activity_definition_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/definition_id
        activity_definition_hash:
          $ref: https://morphloop.dev/contracts/schemas/common/content-hash.json
        title:
          type: string
          minLength: 1
        activity_type:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/token
        skill_ids:
          type: array
          items:
            $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/skill_id
          uniqueItems: true
        lab_backed:
          description: True when starting an attempt starts a lab (the activity has an environment).
          type: boolean
        instructions:
          description: The Definition's learner-facing `instructions` object, verbatim. Its shape is owned by the pack activity schema.
          type: object
      additionalProperties: false
    ActivityList:
      type: object
      required: [activities]
      properties:
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityView'
      additionalProperties: false
    ContentKind:
      description: Learner-facing pack document kinds served over HTTP. Every other kind is withheld (AC-J6).
      enum: [skill, visualization, reference]
    ContentSummary:
      type: object
      required: [kind, definition_id, definition_hash, content_version, title]
      properties:
        kind:
          $ref: '#/components/schemas/ContentKind'
        definition_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/definition_id
        definition_hash:
          $ref: https://morphloop.dev/contracts/schemas/common/content-hash.json
        content_version:
          description: |
            The value to echo as `content_version` in `content.opened`,
            `content.highlighted` and `visualization.step_selected`: the
            document's own `version`, or the pack version for kinds without one.
          $ref: https://morphloop.dev/contracts/schemas/common/versions.json#/$defs/version_label
        title:
          type: string
          minLength: 1
      additionalProperties: false
    ContentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentSummary'
      additionalProperties: false
    ContentDocument:
      type: object
      required: [kind, definition_id, definition_hash, content_version, title, document]
      properties:
        kind:
          $ref: '#/components/schemas/ContentKind'
        definition_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/definition_id
        definition_hash:
          $ref: https://morphloop.dev/contracts/schemas/common/content-hash.json
        content_version:
          $ref: https://morphloop.dev/contracts/schemas/common/versions.json#/$defs/version_label
        title:
          type: string
          minLength: 1
        document:
          description: |
            The parsed pack document of this kind, verbatim. It conforms to the
            pack schema for `kind` (contracts/schemas/pack/); the link is left
            out until the pack schemas are frozen.
          type: object
      additionalProperties: false

    # ---------- attempts / labs ----------
    AttemptStartRequest:
      type: object
      required: [idempotency_key, activity_definition_id]
      properties:
        idempotency_key:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/idempotency_key
        activity_definition_id:
          description: One of the ids from `GET /sessions/{session_id}/activities`.
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/definition_id
      additionalProperties: false
    LabState:
      title: LabInstance state
      type: object
      required:
        - lab_instance_id
        - attempt_id
        - status
        - terminal_id
        - terminal_path
        - replaced_by_lab_instance_id
      properties:
        lab_instance_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/lab_instance_id
        attempt_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/attempt_id
        status:
          $ref: https://morphloop.dev/contracts/schemas/ws/payloads/lab.status.json#/properties/status
        terminal_id:
          description: Null until the lab is `ready`.
          anyOf:
            - $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/terminal_id
            - type: 'null'
        terminal_path:
          description: Path of the terminal WebSocket, `/labs/{lab_instance_id}/terminal`.
          type: string
          pattern: '^/labs/lab_[0-9A-Za-z]{1,64}/terminal$'
        replaced_by_lab_instance_id:
          description: Set once a reset replaced this instance.
          anyOf:
            - $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/lab_instance_id
            - type: 'null'
      additionalProperties: false
    AttemptResult:
      title: Evaluation result of a completed attempt
      description: The stored events of the evaluation chain, linked by `causation_id` (AC-A3, AC-F3).
      type: object
      required: [outcome, evaluation, evidence, skill_updates, completion]
      properties:
        outcome:
          $ref: https://morphloop.dev/contracts/schemas/events/payloads/activity.completed/1.json#/properties/outcome
        evaluation:
          $ref: '#/components/schemas/EvaluationCompletedEvent'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceCreatedEvent'
        skill_updates:
          type: array
          items:
            $ref: '#/components/schemas/LearnerSkillUpdatedEvent'
        completion:
          $ref: '#/components/schemas/ActivityCompletedEvent'
      additionalProperties: false
    AttemptState:
      title: ActivityAttempt state
      type: object
      required:
        - attempt_id
        - session_id
        - activity
        - status
        - started_at
        - lab
        - last_submission_error
        - result
      properties:
        attempt_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/attempt_id
        session_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/session_id
        activity:
          $ref: '#/components/schemas/ActivityView'
        status:
          description: |
            `active`: the learner is working. `evaluating`: submitted, the
            evaluation chain is running. `completed`: `activity.completed` was
            appended; `result` is set. A retry after `completed` is a new attempt.
          enum: [active, evaluating, completed]
        started_at:
          $ref: https://morphloop.dev/contracts/schemas/common/timestamp.json
        lab:
          description: The current LabInstance, or null for an activity without a lab or after the lab was destroyed.
          anyOf:
            - $ref: '#/components/schemas/LabState'
            - type: 'null'
        last_submission_error:
          description: Set when the latest submission's evaluation failed without changing state (AC-E4).
          anyOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        result:
          anyOf:
            - $ref: '#/components/schemas/AttemptResult'
            - type: 'null'
      additionalProperties: false

    # ---------- events ----------
    StoredEvent:
      description: A stored event (envelope + DB-assigned position/recorded_at), dispatched by type.
      $ref: https://morphloop.dev/contracts/schemas/events/envelope/stored.json
    EvaluationCompletedEvent:
      allOf:
        - $ref: https://morphloop.dev/contracts/schemas/events/envelope/stored.json
        - properties:
            event_type:
              const: evaluation.completed
    EvidenceCreatedEvent:
      allOf:
        - $ref: https://morphloop.dev/contracts/schemas/events/envelope/stored.json
        - properties:
            event_type:
              const: evidence.created
    LearnerSkillUpdatedEvent:
      allOf:
        - $ref: https://morphloop.dev/contracts/schemas/events/envelope/stored.json
        - properties:
            event_type:
              const: learner_skill.updated
    ActivityCompletedEvent:
      allOf:
        - $ref: https://morphloop.dev/contracts/schemas/events/envelope/stored.json
        - properties:
            event_type:
              const: activity.completed
    HighlightEvent:
      allOf:
        - $ref: https://morphloop.dev/contracts/schemas/events/envelope/stored.json
        - properties:
            event_type:
              const: content.highlighted
    MessageRequestedEvent:
      allOf:
        - $ref: https://morphloop.dev/contracts/schemas/events/envelope/stored.json
        - properties:
            event_type:
              const: assistant.message_requested
    MessageGeneratedEvent:
      allOf:
        - $ref: https://morphloop.dev/contracts/schemas/events/envelope/stored.json
        - properties:
            event_type:
              const: assistant.message_generated
    ChatEvent:
      anyOf:
        - $ref: '#/components/schemas/MessageRequestedEvent'
        - $ref: '#/components/schemas/MessageGeneratedEvent'
    ClientEventRequest:
      title: Client-originated learner event
      description: |
        The producer-supplied part of an append request for a learner UI
        action. `allOf` the events dispatch: `event_version` and `payload`
        are checked against the payload schema for `event_type`, so payloads
        are never redefined here. The server supplies the remaining envelope
        fields.
      type: object
      required: [event_type, event_version, occurred_at, idempotency_key, attempt_id, payload]
      properties:
        event_type:
          enum: [content.highlighted, content.opened, visualization.step_selected, memo.edited]
        event_version:
          type: integer
          minimum: 1
        occurred_at:
          description: Client clock at the action; informational, never used for ordering (ADR-0008).
          $ref: https://morphloop.dev/contracts/schemas/common/timestamp.json
        idempotency_key:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/idempotency_key
        attempt_id:
          description: The attempt the action happened in, or null outside an activity. Must belong to the session.
          anyOf:
            - $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/attempt_id
            - type: 'null'
        payload:
          type: object
      allOf:
        - $ref: https://morphloop.dev/contracts/schemas/events/dispatch.json
      additionalProperties: false
    EventAppendResponse:
      type: object
      required: [event]
      properties:
        event:
          $ref: '#/components/schemas/StoredEvent'
      additionalProperties: false
    HighlightEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/HighlightEvent'
      additionalProperties: false
    ChatEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ChatEvent'
      additionalProperties: false
    TimelinePage:
      type: object
      required: [events, last_position, has_more]
      properties:
        events:
          description: Events in ascending position order.
          type: array
          items:
            $ref: '#/components/schemas/StoredEvent'
        last_position:
          description: Position of the last returned event, or the requested `after_position` (0 if omitted) when the page is empty. Pass as the next `after_position`.
          type: integer
          minimum: 0
        has_more:
          description: True when events after `last_position` existed when the page was read.
          type: boolean
      additionalProperties: false

    # ---------- chat ----------
    ChatMessageRequest:
      type: object
      required: [idempotency_key, occurred_at, thread_id, attempt_id, text, references]
      properties:
        idempotency_key:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/idempotency_key
        occurred_at:
          $ref: https://morphloop.dev/contracts/schemas/common/timestamp.json
        thread_id:
          description: Existing thread, or null to start a new one (the server assigns its id).
          anyOf:
            - $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/thread_id
            - type: 'null'
        attempt_id:
          description: The attempt the question is about, or null outside an activity.
          anyOf:
            - $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/attempt_id
            - type: 'null'
        text:
          $ref: https://morphloop.dev/contracts/schemas/events/payloads/assistant.message_requested/1.json#/properties/text
        requested_mode:
          $ref: https://morphloop.dev/contracts/schemas/events/payloads/assistant.message_requested/1.json#/properties/requested_mode
        references:
          description: Explicit references, e.g. the highlight an "Ask AI" quotes (AC-D3). Highlights must already be appended.
          $ref: https://morphloop.dev/contracts/schemas/events/payloads/assistant.message_requested/1.json#/properties/references
      additionalProperties: false
    ChatExchange:
      type: object
      required: [request, reply]
      properties:
        request:
          $ref: '#/components/schemas/MessageRequestedEvent'
        reply:
          $ref: '#/components/schemas/MessageGeneratedEvent'
        memo:
          description: |
            The memo written after this reply, for highlight threads only.
            Null (or absent) when the thread is not a highlight thread, the
            pack has no memo summarizer, the learner already edited the memo,
            or the summarizer failed.
          anyOf:
            - $ref: '#/components/schemas/MemoView'
            - type: 'null'
      additionalProperties: false

    # ---------- memos ----------
    MemoView:
      title: Memo (current state)
      description: |
        One learning memo. `title`/`body` come from the latest
        `memo.recorded` or `memo.edited`. Links back: `highlight_id` (the
        highlight, `GET .../highlights`) and `thread_id` (the popup thread,
        `GET .../chat?thread_id=`). `source_event_ids` are those of the latest
        `memo.recorded`.
      type: object
      required: [memo_id, highlight_id, thread_id, title, body, source_event_ids, edited_by_learner, updated_at, last_event_id]
      properties:
        memo_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/memo_id
        highlight_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/highlight_id
        thread_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/thread_id
        title:
          $ref: https://morphloop.dev/contracts/schemas/events/payloads/memo.recorded/1.json#/properties/title
        body:
          $ref: https://morphloop.dev/contracts/schemas/events/payloads/memo.edited/1.json#/properties/body
        source_event_ids:
          $ref: https://morphloop.dev/contracts/schemas/events/payloads/memo.recorded/1.json#/properties/source_event_ids
        edited_by_learner:
          description: True once any `memo.edited` exists; the summarizer no longer rewrites the memo.
          type: boolean
        updated_at:
          description: '`occurred_at` of the latest memo event.'
          $ref: https://morphloop.dev/contracts/schemas/common/timestamp.json
        last_event_id:
          $ref: https://morphloop.dev/contracts/schemas/common/ids.json#/$defs/event_id
      additionalProperties: false
    MemoList:
      type: object
      required: [memos]
      properties:
        memos:
          type: array
          items:
            $ref: '#/components/schemas/MemoView'
      additionalProperties: false
