# Common OpenAPI components shared by every contracts/openapi/v0.2/paths/*.yaml
# file. Owned by this skeleton PR (#44); a resource PR does not edit this file
# — it adds its own components/<resource>.yaml instead (see ../README.md).
#
# Problem is the RFC 9457 shape the v0.1 API used, carried over verbatim. The
# `code` enum is closed per document (ADR-0015).
Problem:
  title: Problem details
  description: |
    RFC 9457 problem details with a closed `code` vocabulary. `code` → status:
    `invalid-request` 400 (malformed JSON or parameters, including an
    unknown or expired `cursor`);
    `unauthorized` 401 (missing, malformed or expired bearer token or
    socket ticket);
    `forbidden` 403 (authenticated, but the resource belongs to someone
    else or the token lacks the needed permission);
    `not-found` 404;
    `idempotency-key-reused` 409 (same key, different body);
    `state-conflict` 409 (operation not allowed in the current state);
    `validation-failed` 422 (body fails its schema; `errors` lists paths);
    `llm-failed` 502 (an LLM call failed or its output failed validation;
    no learner state changed);
    `rate-limited` 429 (a per-user limit was hit; the `Retry-After` header
    says when to retry);
    `lab-unavailable` 503 (the lab runtime could not start or reset a lab);
    `auth-unavailable` 503 (the identity provider could not be reached to
    verify a token);
    `internal` 500.
  type: object
  required: [type, title, status, code]
  properties:
    type:
      description: URI reference identifying the problem type, `about:blank` or `https://morphloop.dev/problems/<code>`.
      type: string
      format: uri-reference
    title:
      type: string
      minLength: 1
    status:
      type: integer
      minimum: 400
      maximum: 599
    detail:
      type: string
    instance:
      type: string
      format: uri-reference
    code:
      enum:
        - invalid-request
        - unauthorized
        - forbidden
        - not-found
        - idempotency-key-reused
        - state-conflict
        - validation-failed
        - llm-failed
        - rate-limited
        - lab-unavailable
        - auth-unavailable
        - internal
    errors:
      description: Validation errors, for `validation-failed`.
      type: array
      items:
        type: object
        required: [path, message]
        properties:
          path:
            description: JSON path into the request, e.g. `$.payload.end_offset`.
            type: string
          message:
            type: string
        additionalProperties: false
  additionalProperties: false

# Placeholder response body for the per-resource `_stub` endpoints below.
# Replaced by real schemas as each resource PR fills in its own paths file.
Stub:
  title: Stub response
  description: Placeholder only; no meaning until the owning resource PR lands.
  type: object
  properties:
    resource:
      type: string
      minLength: 1
  required: [resource]
  additionalProperties: false

# Keyset pagination query parameters shared by every list operation. A list
# response carries `next_cursor`: an opaque string to pass back as `cursor`
# for the next page, absent or null on the last page. Clients must not parse
# or build a cursor. `next_cursor` is declared inline in each list response
# (not $ref'd from here) so a response schema validates standalone.
CursorParam:
  name: cursor
  in: query
  required: false
  description: Opaque `next_cursor` from the previous page; omit for the first page. Unknown or expired -> 400 `invalid-request`.
  schema:
    type: string
    minLength: 1
LimitParam:
  name: limit
  in: query
  required: false
  description: Maximum number of items in this page.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50
