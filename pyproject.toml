[project]
name = "morphloop"
version = "0.1.0"
description = "Adaptive Interactive Learning OS / Harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiodocker>=0.27.0",
    "alembic>=1.20.0",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "jsonschema>=4.26.0",
    "litellm>=1.83.0",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
    "sqlalchemy>=2",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel ships contracts/ as package data (harness/contracts/), so an installed SDK
# resolves them without the repository checkout (ADR-0018 s19). The repo top-level
# contracts/ stays the single source: `sources` only rewrites the path inside the wheel
# (an editable install keeps reading the checkout).
[tool.hatch.build.targets.wheel]
only-include = ["harness", "domains", "contracts"]
sources = { "contracts" = "harness/contracts" }

# Apps built on the SDK (apps/<app>/, ADR-0018 s19) are workspace members with their own
# pyproject.toml and tests; they depend on this package by name. The dev group depends on
# each app so `uv sync` installs it and the root gate (pytest, mypy, lint-imports) sees it;
# the SDK's runtime dependencies and wheel never include an app.
[tool.uv.workspace]
members = ["apps/*"]

[tool.uv.sources]
morphloop-swe = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
src = [".", "apps/swe"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
packages = ["harness", "domains", "swe"]

# SDK tests only. An app's tests run as their own step (`uv run pytest -q apps/swe/tests`,
# which picks up apps/swe/pyproject.toml): the SDK tests stand in test-only stubs for the
# app's artifact types, and one process registers each type name once.
[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: same-named test files in different dirs (tests/core/<r>/test_<r>.py,
# tests/api/v2/test_<r>.py) do not collide.
addopts = ["--import-mode=importlib"]
# Dirs whose shared test helpers are imported as top-level modules.
pythonpath = ["tests/api", "tests/cli", "tests/core", "tests/domains/dns"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "morphloop-swe",
    "mypy>=2.3.1",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-docker>=7.2.0.20260827",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]
