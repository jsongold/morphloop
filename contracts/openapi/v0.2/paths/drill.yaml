# URL -> Path Item map for the drill resource (ADR-0018). Owned by the
# drill resource PR: this file is the only file that PR edits (plus an
# optional new components/drill.yaml for drill-specific schemas).
# Never edit ../root.yaml or another resource's paths/*.yaml — new URLs are
# just new top-level keys in this file, merged into the document by
# harness.testing.openapi_v2.load_merged_openapi_v2_spec (duplicate URLs
# across files are a load-time error). See ../README.md.
#
# Drill: items, answers. Understanding gap = (question + expected) - actual. Items are content (pack-authored and generated are peers, distinguished by label); answers (actual, gap) are ws-scoped.
#
/drills:
  get:
    tags: [drill]
    operationId: listDrillItems
    summary: Drill items carrying every given label (pack-bundled and generated alike).
    description: |
      Items are teaching material (no learner scope). Every item carries
      `origin:pack` or `origin:generated`. `expected` is never included.
    parameters:
      - name: labels
        in: query
        description: Repeat to require several labels, e.g. `?labels=topic:network.dns&labels=origin:pack`.
        schema:
          type: array
          items: {type: string}
        style: form
        explode: true
      - $ref: '../root.yaml#/components/parameters/Cursor'
      - $ref: '../root.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Matching items.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                next_cursor:
                  type: [string, 'null']
                  description: Opaque cursor for the next page; absent or null on the last page.
                items:
                  type: array
                  items: &drill_item
                    type: object
                    description: A drill item without `expected`.
                    required: [id, question, answer_mode, labels]
                    properties:
                      id: {type: string}
                      question: {type: string, description: CommonMark.}
                      answer_mode: {enum: [text, choice, artifact]}
                      choices: {type: array, items: {type: string}}
                      artifact_ref: {type: string}
                      labels: {type: array, items: {type: string}}
                    additionalProperties: false
              additionalProperties: false
      default:
        $ref: '../root.yaml#/components/responses/Problem'

/drills/{item_id}:
  get:
    tags: [drill]
    operationId: getDrillItem
    summary: One drill item, learner-facing (without `expected`).
    parameters:
      - {name: item_id, in: path, required: true, schema: {type: string}}
    responses:
      '200':
        description: The item.
        content:
          application/json:
            schema: *drill_item
      default:
        $ref: '../root.yaml#/components/responses/Problem'

/ws/{ws_id}/drills/{item_id}/answers:
  post:
    tags: [drill]
    operationId: answerDrillItem
    summary: Record the learner's answer to one item in a ws (`drill.answered`).
    description: |
      `text` / `choice` items take `actual` (for `choice`, one of the item's
      choices); `artifact` items take `artifact_id`. The ws must exist (404);
      the event's session is the ws's session and its user is the server's
      single learner. The gap is judged after the answer commits.
    parameters:
      - {name: ws_id, in: path, required: true, schema: {type: string}}
      - {name: item_id, in: path, required: true, schema: {type: string}}
      - name: Idempotency-Key
        in: header
        required: false
        description: |
          Client-generated UUID, used as the event id. A resend with the same
          key and body returns the stored event; the same key with another
          body is 409. The server assigns a fresh UUID when absent.
        schema: {type: string, format: uuid}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              actual: {type: string}
              artifact_id: {type: string}
            additionalProperties: false
    responses:
      '201':
        description: |
          The stored `drill.answered` event and judgment status. `pending`
          means judgment could not finish; resending the same key retries it.
          The event's full shape is
          `contracts/schemas/events/envelope/v2/stored.json` with payload
          `contracts/schemas/events/payloads/drill.answered/1.json`.
        content:
          application/json:
            schema:
              type: object
              required: [id, position, type, created_at, actor, user_id, ws_id, payload, judgment_status]
              properties:
                id: {type: string}
                position: {type: integer, minimum: 1}
                type: {const: drill.answered}
                created_at: {type: string, format: date-time}
                actor: {const: learner}
                user_id: {type: string}
                session_id: {type: string}
                ws_id: {type: string}
                payload: {type: object}
                judgment_status: {type: string, enum: [complete, pending]}
      default:
        $ref: '../root.yaml#/components/responses/Problem'

/ws/{ws_id}/drills/answers:
  get:
    tags: [drill]
    operationId: listDrillAnswers
    summary: The caller's answers in a ws, in creation order.
    description: |
      Never `actual` or `expected`. `judgment_status` is `unjudged` until the
      answer's gap has been judged (issue #65); `gap` is `null` until then.
      The ws must exist and belong to the caller (404 otherwise).
    parameters:
      - {name: ws_id, in: path, required: true, schema: {type: string}}
      - $ref: '../root.yaml#/components/parameters/Cursor'
      - $ref: '../root.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Matching answers, oldest first.
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                next_cursor:
                  type: [string, 'null']
                  description: Opaque cursor for the next page; absent or null on the last page.
                items:
                  type: array
                  items:
                    type: object
                    required: [item_id, answer_event_id, judgment_status, gap]
                    additionalProperties: false
                    properties:
                      item_id: {type: string}
                      answer_event_id: {type: string}
                      judgment_status: {enum: [unjudged, judged]}
                      gap:
                        type: [object, "null"]
                        description: The judged gap (`drill.judged` payload's `gap`, issue #65), or null.
      default:
        $ref: '../root.yaml#/components/responses/Problem'
