# URL -> Path Item map for the textbook resource (ADR-0018). Owned by the
# textbook resource PR: this file is the only file that PR edits (plus an
# optional new components/textbook.yaml for textbook-specific schemas).
# Never edit ../root.yaml or another resource's paths/*.yaml — new URLs are
# just new top-level keys in this file, merged into the document by
# harness.testing.openapi_v2.load_merged_openapi_v2_spec (duplicate URLs
# across files are a load-time error). See ../README.md.
#
# Textbook: docs[].blocks[]; reading order per topic is topic.docs[]. Unscoped, immutable teaching material. Body is CommonMark; an Artifact is embedded as `::artifact{type=... ref=...}`. A block is a paragraph-sized unit, id assigned once at finalization.
/textbook/docs:
  get:
    tags: [textbook]
    operationId: listTextbookDocs
    summary: A topic's reading list.
    description: |
      The topic's own `topic.docs[]` in order (label `origin:pack`, the base
      text), then runtime-generated docs labelled `topic:<topic_id>` (label
      `origin:generated`). Unknown topic: 404 `not-found`.
    parameters:
      - name: topic_id
        in: query
        required: true
        schema: {type: string, minLength: 1}
      - $ref: '../root.yaml#/components/parameters/Cursor'
      - $ref: '../root.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Doc summaries in reading order.
        content:
          application/json:
            schema:
              type: object
              required: [docs]
              additionalProperties: false
              properties:
                next_cursor:
                  type: [string, 'null']
                  description: Opaque cursor for the next page; absent or null on the last page.
                docs:
                  type: array
                  items:
                    type: object
                    required: [id, title, labels]
                    additionalProperties: false
                    properties:
                      id: {type: string, minLength: 1}
                      title: {type: string, minLength: 1}
                      labels: {type: array, items: {type: string}}
      default:
        $ref: '../root.yaml#/components/responses/Problem'
/textbook/docs/{doc_id}:
  get:
    tags: [textbook]
    operationId: getTextbookDoc
    summary: One textbook doc with each block's plaintext.
    description: |
      `blocks[].plaintext` is the block's displayed text (rules and test
      vectors: `contracts/fixtures/plaintext/`); highlight positions count in
      it. Unknown doc: 404 `not-found`.
    parameters:
      - name: doc_id
        in: path
        required: true
        schema: {type: string, minLength: 1}
    responses:
      '200':
        description: The doc.
        content:
          application/json:
            schema:
              type: object
              required: [id, title, labels, blocks]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                title: {type: string, minLength: 1}
                labels: {type: array, items: {type: string}}
                blocks:
                  type: array
                  items:
                    type: object
                    required: [id, body, labels, plaintext]
                    additionalProperties: false
                    properties:
                      id: {type: string, minLength: 1}
                      body: {type: string, description: CommonMark.}
                      labels: {type: array, items: {type: string}}
                      plaintext: {type: string}
      default:
        $ref: '../root.yaml#/components/responses/Problem'
