# URL -> Path Item map for the notebook resource (ADR-0018). Owned by the
# notebook resource PR: this file is the only file that PR edits (plus an
# optional new components/notebook.yaml for notebook-specific schemas).
# Never edit ../root.yaml or another resource's paths/*.yaml — new URLs are
# just new top-level keys in this file, merged into the document by
# harness.testing.openapi_v2.load_merged_openapi_v2_spec (duplicate URLs
# across files are a load-time error). See ../README.md.
#
# Notebook: functions only, no children of its own (ADR-0018: a resource has children; a function-only surface is not a resource). Chat drives the notebook through this function surface.
#
/notebook/search:
  get:
    tags: [notebook]
    operationId: searchNotebook
    summary: Search textbook, memo, and drill content.
    parameters:
      - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
      - {name: session_id, in: query, required: false, schema: {type: string}}
      - $ref: '../root.yaml#/components/parameters/Cursor'
      - $ref: '../root.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: Matching notebook content.
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                next_cursor:
                  type: [string, 'null']
                  description: Opaque cursor for the next page; absent or null on the last page.
                results:
                  type: array
                  items:
                    discriminator: {propertyName: kind}
                    oneOf:
                      - type: object
                        required: [kind, id, text]
                        properties:
                          kind: {const: textbook_doc}
                          id: {type: string}
                          text: {type: string}
                        additionalProperties: false
                      - type: object
                        required: [kind, id, block_id, text]
                        properties:
                          kind: {const: textbook_block}
                          id: {type: string}
                          block_id: {type: string}
                          text: {type: string}
                        additionalProperties: false
                      - type: object
                        required: [kind, id, text]
                        properties:
                          kind: {const: memo_entry}
                          id: {type: string}
                          text: {type: string}
                        additionalProperties: false
                      - type: object
                        required: [kind, id, text]
                        properties:
                          kind: {const: drill_item}
                          id: {type: string}
                          text: {type: string}
                        additionalProperties: false
              additionalProperties: false
      default:
        $ref: '../root.yaml#/components/responses/Problem'
/notebook/workspace/build:
  post:
    tags: [notebook]
    operationId: buildNotebookWorkspace
    summary: Create a workspace with related textbook docs and drill items.
    parameters:
      - {name: Idempotency-Key, in: header, required: false, schema: {type: string, format: uuid}}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [session_id]
            properties:
              session_id: {type: string}
              topic: {type: string}
              labels: {type: array, uniqueItems: true, items: {type: string}}
            oneOf:
              - required: [topic]
                not: {required: [labels]}
              - required: [labels]
                not: {required: [topic]}
                properties: {labels: {minItems: 1}}
            additionalProperties: false
    responses:
      '201':
        description: Workspace and selected content.
        content:
          application/json:
            schema:
              type: object
              required: [workspace, documents, drills]
              properties:
                # The stored `ws.created` event this build appended (the same
                # shape POST /ws returns), payload `.../payloads/ws.created/1.json`.
                workspace:
                  type: object
                  required:
                    [
                      id,
                      position,
                      type,
                      created_at,
                      actor,
                      user_id,
                      session_id,
                      ws_id,
                      payload,
                    ]
                  properties:
                    id: {type: string}
                    position: {type: integer, minimum: 1}
                    type: {const: ws.created}
                    created_at: {type: string, format: date-time}
                    actor: {const: learner}
                    user_id: {type: string}
                    session_id: {type: string}
                    ws_id: {type: string}
                    payload:
                      type: object
                      required: [labels]
                      properties:
                        labels:
                          type: array
                          uniqueItems: true
                          items: {type: string}
                      additionalProperties: false
                  additionalProperties: false
                documents:
                  type: array
                  items:
                    type: object
                    required: [id, title, labels]
                    properties:
                      id: {type: string}
                      title: {type: string}
                      labels: {type: array, items: {type: string}}
                    additionalProperties: false
                drills:
                  type: array
                  items:
                    type: object
                    required: [id, question, answer_mode, labels]
                    properties:
                      id: {type: string}
                      question: {type: string}
                      answer_mode: {enum: [text, choice, artifact]}
                      labels: {type: array, items: {type: string}}
                      choices: {type: array, items: {type: string}}
                      artifact_ref: {type: string}
                    additionalProperties: false
              additionalProperties: false
      default:
        $ref: '../root.yaml#/components/responses/Problem'
/notebook/generate:
  post:
    tags: [notebook]
    operationId: generateNotebookContent
    summary: Start pre-generation of one drill item or textbook doc.
    description: |
      Accepted at once; generation runs in the background (#64). The result
      is not returned: a candidate that passes validation is stored in
      generated documents with the label `origin:generated`, a rejected one
      is never stored.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource:
                enum: [drill, textbook]
              memo_entries:
                type: array
                items: {type: object}
              gap:
                type: [object, 'null']
            additionalProperties: false
    responses:
      '202':
        description: Generation started.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {const: accepted}
      default:
        $ref: '../root.yaml#/components/responses/Problem'
