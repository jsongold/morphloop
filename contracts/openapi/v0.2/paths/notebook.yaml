# URL -> Path Item map for the notebook resource (ADR-0018). Owned by the
# notebook resource PR: this file is the only file that PR edits (plus an
# optional new components/notebook.yaml for notebook-specific schemas).
# Never edit ../root.yaml or another resource's paths/*.yaml — new URLs are
# just new top-level keys in this file, merged into the document by
# harness.testing.openapi_v2.load_merged_openapi_v2_spec (duplicate URLs
# across files are a load-time error). See ../README.md.
#
# Notebook: functions only, no children of its own (ADR-0018: a resource has children; a function-only surface is not a resource). Chat drives the notebook through this function surface.
#
/notebook/generate:
  post:
    tags: [notebook]
    operationId: generateNotebookContent
    summary: Start pre-generation of one drill item or textbook doc.
    description: |
      Accepted at once; generation runs in the background (#64). The result
      is not returned: a candidate that passes validation is stored in
      generated documents with the label `origin:generated`, a rejected one
      is never stored.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource:
                enum: [drill, textbook]
              memo_entries:
                type: array
                items: {type: object}
              gap:
                type: [object, 'null']
            additionalProperties: false
    responses:
      '202':
        description: Generation started.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {const: accepted}
      default:
        $ref: '../root.yaml#/components/responses/Problem'
