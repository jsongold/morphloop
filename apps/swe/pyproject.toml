[project]
name = "morphloop-swe"
version = "0.2.0"
description = "Software Engineering app on the morphloop SDK: lab and diagram artifacts, the SE pack"
requires-python = ">=3.13"
dependencies = ["morphloop"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swe"]

# Inside the SDK repository the SDK is the workspace root; once this app moves to its
# own repository this becomes a published version of `morphloop`.
[tool.uv.sources]
morphloop = { workspace = true }

# Standalone run (`cd apps/swe && pytest`); at the repository root the root config
# collects these tests too.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]
