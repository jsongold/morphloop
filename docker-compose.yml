# The SDK's own stack: Postgres plus the bare SDK server (harness.api.app), for SDK
# development. Apps (with their web UIs) live in their own repositories.
# Start: docker compose up -d --build
# The api host port defaults to 8000; override with API_PORT.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: morphloop
      POSTGRES_PASSWORD: morphloop
      POSTGRES_DB: morphloop
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morphloop -d morphloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    # Local secrets (e.g. OPENAI_API_KEY). Optional, so the stack still starts
    # without it; read on every `up`, so rebuilding one service keeps the key.
    env_file:
      - path: .env.local
        required: false
    environment:
      # DOCKER_HOST and MORPHLOOP_LLM_PROVIDER are passed through from the host
      # only when set there (the Docker endpoint is not the mounted socket
      # below; MORPHLOOP_LLM_PROVIDER=fake is dev-stack.sh's --fake-llm, #130).
      # LLM keys come from env_file above: a bare name here would override it
      # with nothing.
      - DATABASE_URL=postgresql+psycopg://morphloop:morphloop@db:5432/morphloop
      - DOCKER_HOST
      - MORPHLOOP_LLM_PROVIDER
    # The lab runtime starts learner containers as siblings, so the api needs
    # the host's Docker endpoint. This grants the api container host-root
    # equivalent power; it is a local-development stack. Learner containers
    # never receive the socket (docs/ARCHITECTURE.md, security boundaries).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
